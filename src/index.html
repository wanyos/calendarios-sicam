<!DOCTYPE html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./img/logo-favicon.png"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="google" value="notranslate"/>

    <!-- WHY: Dosis (titulares) + Catamaran (cuerpo) son las Google Fonts que usa sicamemt.org
         como sustitutas open-source de su DinPro propietaria. preconnect acelera la carga. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700&family=Dosis:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./estilo.css"/>
    <!-- WHY: title neutro como fallback. index.js lo sobrescribe con
         branding.title al arrancar (SICAM o el white-label). -->
    <title>Calendarios</title>
  </head>

  <body translate="no">

    <!-- WHY: el logo (.hero__logo) y el eyebrow (.hero__eyebrow) los
         inyecta index.js desde @branding al arrancar. Si branding.enabled
         es false (build white-label) no se inyecta nada y queda solo
         el .hero__text con el título. -->
    <header class="hero">
      <div class="hero__inner">
        <div class="hero__text">
          <h2 id="titulo" class="hero__title"></h2>
        </div>
      </div>
    </header>

    <nav class="toolbar">
      <div class="toolbar__inner">

        <!-- WHY: select_opcion (categoría) es el filtro principal — primero a la izquierda.
             Las <option> se generan desde Constantes.js (CATEGORIAS) al cargar la página. -->
        <select id="select_opcion" class="select select--primary"></select>

        <div id="nav_sup" class="nav__sup">
          <div class="field">
            <label for="select_year">Año</label>
            <!-- WHY: las <option> se generan en JS (ventana deslizante -2/+10
                 desde el año en curso). Si las hardcodeamos aquí, el select
                 se queda obsoleto cada año natural. -->
            <select id="select_year" class="select"></select>
          </div>

          <div class="field">
            <label for="select_grupo">Grupo</label>
            <select id="select_grupo" class="select"></select>
          </div>

          <div class="field">
            <label for="select_subgrupo">Subgrupo</label>
            <select id="select_subgrupo" class="select"></select>
          </div>

          <div id="opcion-refuerzo" class="opcion-refuerzo">
            <!-- WHY: <option> generadas desde Constantes.js (NUMEROS_REFUERZO,
                 LETRAS_REFUERZO) al cargar la página. -->
            <div class="field field--radio">
              <input class="radio" id="rdNum" type="radio" value="Num" name="opcion" checked/>
              <label for="select-num">Num</label>
              <select name="select-num" id="select-num" class="select"></select>
            </div>

            <div class="field field--radio">
              <input class="radio" id="rdLtr" type="radio" value="Ltr" name="opcion"/>
              <label for="select-ltr">Ltr</label>
              <select name="select-ltr" id="select-ltr" class="select"></select>
            </div>
          </div>
        </div>

        <button class="btn" type="submit" name="btn" id="btn">Buscar</button>

      </div>
    </nav>

    <main class="main">
      <!-- WHY: la leyenda pasa de aside vertical a chips horizontales — fija el descentrado
           y deja todo el ancho del main para la grid de cards de meses. -->
      <!-- WHY: data-rol identifica cada rótulo de forma estable. initRotulos
           los busca por data-rol con querySelector — antes dependía de la
           posición exacta (firstElementChild, nextElementSibling), lo que
           rompía silenciosamente si alguien reordenaba el HTML. -->
      <div id="rotulos-subgrupo" class="rotulos">
        <h4 data-rol="libre" class="libres">Libre</h4>
        <h4 data-rol="subgrupo" class="subgrupo">Subgrupo</h4>
        <h4 data-rol="sub1" class="sub1">Grupo(A/C/E/G)</h4>
        <h4 data-rol="sub2" class="sub2">Grupo(B/D/F/H)</h4>
      </div>

      <div id="container-tabla" class="container-tabla"></div>
    </main>

    <!-- WHY: el <p> con el texto del footer lo inyecta index.js desde
         @branding si está definido. Si no, queda como banda decorativa
         vacía (la altura la da el padding del .footer en CSS). -->
    <footer class="footer"></footer>

    <script type="module" src="./index.js"></script>
  </body>
</html>
